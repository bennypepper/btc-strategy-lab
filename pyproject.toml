[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-strategy-lab"
version = "1.0.0"
description = "Interactive Bitcoin backtesting simulator and research visualization laboratory"
readme = "README.md"
authors = [{ name = "Benedict Pepper" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "numba>=0.58.0",
    "plotly>=5.18.0",
    "altair>=5.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
